version: '3.8'

services:
  corral:
    build:
      context: ../..
      dockerfile: ./.docker/corral-envs/Dockerfile
    image: ${REGISTRY:-}${ORGANIZATION:-corral}/${CORRAL_ENVS_IMAGE:-corral-envs}${TAG:-}
    container_name: ${CONTAINER_NAME:-corral-env}
    ports:
      - "${HOST_PORT:-8000}:${CONTAINER_PORT:-8000}"
    environment:
      - ENV_MODULE=${ENV_MODULE:?ENV_MODULE is required - e.g., tasks.corral_md.src.corral_md.env}
      - CORRAL_HOST=${CORRAL_HOST:-0.0.0.0}
      - CORRAL_PORT=${CONTAINER_PORT:-8000}
      - CORRAL_WORK_DIR=${CORRAL_WORK_DIR:-/workspace}
      - ${ADDITIONAL_ENV_VARS:-}
    volumes:
      - ${VOLUME_NAME:-corral_workspace}:/workspace
    command: ${ENV_COMMAND:-}
    restart: ${RESTART_POLICY:-unless-stopped}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${CONTAINER_PORT:-8000}/tasks"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  corral_workspace:
