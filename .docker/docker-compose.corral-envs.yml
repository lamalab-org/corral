services:
  corral:
    build:
      context: ../..
      dockerfile: ./.docker/corral-envs/Dockerfile
    image: ${REGISTRY:-}${ORGANIZATION:-corral}/${CORRAL_ENVS_IMAGE:-corral-envs}${TAG:-}
    container_name: ${CONTAINER_NAME:-corral-env}
    ports:
      - "${HOST_PORT:-8000}:${CONTAINER_PORT:-8000}"
    environment:
      - ENV_MODULE=${ENV_MODULE:?ENV_MODULE is required - e.g., my_env.env}
      - CORRAL_HOST=${CORRAL_HOST:-0.0.0.0}
      - CORRAL_PORT=${CONTAINER_PORT:-8000}
      - CORRAL_WORK_DIR=${CORRAL_WORK_DIR:-/workspace}
      # Optional: JSON string with environment-specific arguments
      # These are converted to CLI arguments by the entrypoint script
      # Example: CORRAL_ENV_ARGS='{"dir": "/workspace", "subtask_level": true}'
      - CORRAL_ENV_ARGS=${CORRAL_ENV_ARGS:-}
    volumes:
      - ${VOLUME_NAME:-corral_workspace}:/workspace
    restart: ${RESTART_POLICY:-unless-stopped}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${CONTAINER_PORT:-8000}/tasks"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  corral_workspace:
