theme:
  name: terminal
  palette: gruvbox_dark

site_name: Corral  Documentation

nav:
    - Home: 'index.md'
    - Troubleshooting: 'tools.md'
    - Setting Up: 'setting_up.md'
    - Tutorials: 'tutorials.md'
    - How-To-Guides: 'how_to_guides.md'
    - Reference: 'reference.md'


markdown_extensions:
  # Python Markdown
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - tables
  - admonition
  - toc:
      permalink: "#"
      permalink_title: Anchor link to this section for reference

  # PyMdown Extensions
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.superfences
  - pymdownx.highlight:
      use_pygments: true
      pygments_style: catppuccin-frappe
      noclasses: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - docs

extra_css:
  - copy-code.css

extra_javascript:
  - copy-code.js
