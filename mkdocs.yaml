theme:
  name: terminal
  palette: gruvbox_dark

site_name: Corral Documentation
site_url: https://lamalab-org.github.io/corral/


repo_name: lamalab-org/corral
repo_url: https://github.com/lamalab-org/corral

copyright: LAMAlab x M3RG


nav:
    - Home: 'index.md'
    - Setting Up: 'setting_up.md'
    - Documentation:
      - How-To-Guides: 'documentation/how_to_guides.md'
      - Tutorials: 'documentation/tutorials.md'
      - Explanations: 'documentation/explanation.md'
      - Reference: 'documentation/reference.md'
      - Hydra Launching: 'documentation/how_tos/hydra_launching.md'
    - About Us: 'about_us.md'


markdown_extensions:
  # Python Markdown
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - tables
  - admonition
  - toc:
      toc_depth: "2"
      permalink: "#"
      permalink_title: Anchor link to this section for reference
  - pymdownx.blocks.details:
      types:
        - name: info
          class: terminal-alert
          title: Info

  # PyMdown Extensions
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.superfences
  - pymdownx.highlight:
      use_pygments: true
      pygments_style: catppuccin-frappe
      noclasses: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - docs

extra_css:
  - copy-code.css

extra_javascript:
  - copy-code.js

plugins:
  - search
  - autorefs
