[project]
name = "corral-tools"
version = "0.1.0"
description = "Tools package from corral"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "corral",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["corral_tools"]

[tool.uv.sources]
corral = { git = "https://github.com/lamalab-org/mat-agent-bench.git", rev = "main" }

[project.optional-dependencies]
dev = [
    "ruff>=0.9.2",
]

[
tool.ruff
]
# Target Python 3.9+
target-version = "py39"

# Enable all rules by default
select = ["ALL"]
ignore = [
    "D",  # Ignore documentation errors
    "ANN", # Ignore type annotation errors
]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 88
