name: Infra failures

# Runs reports/find_infra_failures.py on demand and posts the tables on the PR.
#
# Triggers:
# - comment `/infra-failures [lfs] [mini-v2] [<environment> ...]` on a pull request
#   (members and collaborators only)
# - add the `check-infra-failure` label to scan changed reports on a pull request
# - run it from the Actions tab (workflow_dispatch)
#
# The label trigger runs this workflow before it merges on same-repository PRs.
# The comment trigger uses the scanner from the default branch.
on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      environments:
        description: "Environments to scan, space-separated (default: all); add mini-v2 for mini runs"
        required: false
        default: ""
      lfs:
        description: "Fetch Git LFS reports so they are scanned too"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: infra-failures-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.event.label.name == 'check-infra-failure' ||
          (github.event.action == 'synchronize' &&
            contains(github.event.pull_request.labels.*.name, 'check-infra-failure')))) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/infra-failures') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
          github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - name: Read arguments
        id: args
        env:
          EVENT: ${{ github.event_name }}
          COMMENT: ${{ github.event.comment.body }}
          INPUT_ENVS: ${{ inputs.environments }}
          INPUT_LFS: ${{ inputs.lfs }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          lfs=false
          mini_v2=false
          envs=""
          case "$EVENT" in
            issue_comment)
              number="$ISSUE_NUMBER"
              ref="refs/pull/$ISSUE_NUMBER/head"
              # Words after the command on its first line.
              words=$(printf '%s\n' "$COMMENT" | head -n1 | sed 's|^/infra-failures||')
              ;;
            pull_request)
              number="$PR_NUMBER"
              ref="$PR_SHA"
              words=""
              ;;
            *)
              number=""
              ref="$GITHUB_REF"
              words="$INPUT_ENVS"
              [ "$INPUT_LFS" = "true" ] && lfs=true
              ;;
          esac
          for word in $words; do
            if [ "$word" = "lfs" ]; then
              lfs=true
            elif [ "$word" = "mini-v2" ]; then
              mini_v2=true
            elif printf '%s' "$word" | grep -Eq '^[a-z0-9_]+$'; then
              envs="$envs $word"
            else
              echo "::error::invalid environment name: $word"
              exit 1
            fi
          done
          if [ "$mini_v2" = true ]; then
            envs="--mini-v2 $envs"
          fi
          {
            echo "number=$number"
            echo "ref=$ref"
            echo "lfs=$lfs"
            echo "envs=$envs"
          } >> "$GITHUB_OUTPUT"

      - name: Acknowledge the comment
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST
          "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions"
          -f content=eyes

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          path: report-data
          ref: ${{ steps.args.outputs.ref }}
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Find infrastructure failures
        env:
          ENVS: ${{ steps.args.outputs.envs }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LFS: ${{ steps.args.outputs.lfs }}
          LFS_URL: ${{ github.server_url }}/${{ github.repository }}.git/info/lfs
        working-directory: report-data
        # $ENVS holds validated names only and is split into arguments on purpose.
        run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git diff --no-renames --name-only --diff-filter=AMT -z "$BASE_SHA...HEAD" -- reports > "$RUNNER_TEMP/changed-reports"
            args=(--report)
            includes=()
            while IFS= read -r -d '' path; do
              if [[ "$path" =~ ^(reports/[^/,]+/(full|mini-v2))/level_[0-9]+/[^/,]+/report\.json\.(gz|xz)$ ]]; then
                args+=("$path")
                includes+=("$path" "${BASH_REMATCH[1]}/trials.csv")
              fi
            done < "$RUNNER_TEMP/changed-reports"
            if [ "${#includes[@]}" -gt 0 ]; then
              include=$(IFS=,; printf '%s' "${includes[*]}")
              git -c "lfs.url=$LFS_URL" lfs pull --include="$include" --exclude=""
            fi
          elif [ "$LFS" = true ]; then
            git -c "lfs.url=$LFS_URL" lfs pull --include="reports/**" --exclude=""
          fi
          python ../reports/find_infra_failures.py $ENVS --reports-dir reports \
            --csv ../infra-failures.csv --markdown ../infra-failures.md "${args[@]}"

      - name: Write the report
        env:
          ENVS: ${{ steps.args.outputs.envs }}
          LFS: ${{ steps.args.outputs.lfs }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            # Marks this workflow's comment so it is updated, not duplicated.
            echo "<!-- corral-infra-failures -->"
            echo "## Infrastructure failure analysis"
            echo
            echo "Commit $(git -C report-data rev-parse --short HEAD)"
            if [ "$EVENT" = pull_request ]; then
              echo "Scope: reports changed by this pull request, including Git LFS"
            else
              echo "Environments: ${ENVS:-all} · Git LFS requested: $LFS"
            fi
            echo
            cat infra-failures.md
            echo
            echo "[Workflow run and CSV of every finding]($RUN_URL)" \
              "· rerun with \`/infra-failures [lfs] [mini-v2] [<environment> ...]\`"
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: infra-failures
          path: |
            infra-failures.csv
            comment.md

      - name: Comment on the pull request
        if: steps.args.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.args.outputs.number }}
          REPO: ${{ github.repository }}
        # Update this workflow's previous comment instead of adding a new one.
        run: |
          id=$(gh api "repos/$REPO/issues/$NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]"
              and (.body | startswith("<!-- corral-infra-failures -->"))) | .id' | tail -n1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md
          else
            gh api --method POST "repos/$REPO/issues/$NUMBER/comments" -F body=@comment.md
          fi
