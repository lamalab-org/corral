name: Deploy Site & Docs

on:
  push:
    branches: [main, dev]
  pull_request:
    paths:
      - docs/**
      - site/**
      - tasks/**/tools.py
      - tasks/**/score.py
      - tasks/**/env.py
      - tasks/**/environments/**/tasks_json/**
      - tasks/**/environments/**/subtasks_json/**
      - pyproject.toml
      - mkdocs.yaml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv sync --extra docs

      - name: Generate landing-page data
        run: uv run python site/extract_data.py

      - name: Build MkDocs into docs/ subdirectory
        run: uv run mkdocs build --site-dir _build/docs

      - name: Assemble site
        run: |
          mkdir -p _build
          cp site/index.html _build/
          cp site/data.js _build/
          cp site/traces.js _build/
          cp site/annotator.js _build/
          cp site/corral_logo.png _build/
          cp site/corral_arch.png _build/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _build

  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
