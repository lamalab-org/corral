name: Publish Docker Images

# Builds and publishes Docker images to GHCR:
#   - ghcr.io/lamalab-org/corral-agent-runner (benchmark runner)
#   - ghcr.io/lamalab-org/corral-envs-base (base image for environments)

on:
  push:
    branches: [main]
    paths:
      - '.docker/**'
      - '.github/workflows/docker-publish.yaml'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even without .docker changes'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  # Images will be published as:
  # ghcr.io/lamalab-org/corral-agent-runner
  # ghcr.io/lamalab-org/corral-envs-base

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: corral-agent-runner
            context: .docker/corral-agent-runner
            dockerfile: .docker/corral-agent-runner/Dockerfile
          - name: corral-envs-base
            context: .docker/corral-envs
            dockerfile: .docker/corral-envs/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image.name }}
          tags: |
            # Set latest tag for default branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Short SHA
            type=sha,prefix=
            # Date-based tag
            type=raw,value={{date 'YYYYMMDD'}},enable={{is_default_branch}}

      - name: Build and push ${{ matrix.image.name }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  verify:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Verify images are available
        run: |
          echo "Verifying images in GHCR..."
          echo "✅ ghcr.io/${{ github.repository_owner }}/corral-agent-runner:latest"
          echo "✅ ghcr.io/${{ github.repository_owner }}/corral-envs-base:latest"
          echo ""
          echo "Images have been published successfully!"
          echo ""
          echo "To pull the images:"
          echo "  docker pull ghcr.io/${{ github.repository_owner }}/corral-agent-runner:latest"
          echo "  docker pull ghcr.io/${{ github.repository_owner }}/corral-envs-base:latest"
