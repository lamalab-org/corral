name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Code-quality / formatting
  # ---------------------------------------------------------------------------
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ensure the desired interpreter is on the runner
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Download the uv binary (with caching)
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Install project + dev + all extras into .venv
      - name: Sync environment (dev + extras)
        run: uv sync --all-extras --dev

      # Run pre-commit inside the venv
      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files

      # Cache pre-commit hook environments
      - name: Cache pre-commit hooks
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # Fail if pre-commit reformatted files
      - name: Verify no changes were introduced
        run: |
          if ! git diff --quiet; then
            echo "::error::Code formatting issues found. Run pre-commit locally and commit the changes."
            git --no-pager diff
            exit 1
          fi

  tests:
    needs: code-quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11"]

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Ensure lockfile matches pyproject and install everything reproducibly
      - name: Verify lockfile & sync env
        run: |
          uv lock --check        # cheap validation of uv.lock vs pyproject.toml
          uv sync --frozen --all-extras --dev

      # Run the test suite inside the venv
      - name: Run tests
        run: uv run pytest --cov=corral

      # Optional: clean cached wheels to keep the runner’s cache small
      - name: Prune uv cache
        if: ${{ always() }}
        run: uv cache prune --ci
