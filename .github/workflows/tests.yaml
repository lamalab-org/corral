name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Create venv and install pre-commit
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install pre-commit

      - name: Cache pre-commit hooks
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit checks
        run: |
          source .venv/bin/activate
          pre-commit run --all-files

      - name: Check if changes were made
        run: |
          if ! git diff --quiet; then
            echo "::error::Code formatting issues found. Run pre-commit locally and commit changes."
            git diff
            exit 1
          fi

  # Test the main corral package
  test-main:
    needs: code-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Ensure Git LFS is initialized
        run: |
          git lfs install
          # Try to pull LFS objects, but don't fail if some are missing
          git lfs pull --exclude="" || echo "Some LFS objects missing, continuing..."

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install root project
        run: uv sync --all-extras --dev

      # Samplemath has no task-test job; its runtime tests run in the root suite.
      - name: Install samplemath and check environment import
        run: |
          uv pip install -e ./tasks/samplemath
          uv run --no-sync python -c "from importlib import import_module; from corral.runtime.environment_loader import ENVIRONMENT_PRESETS; import_module(ENVIRONMENT_PRESETS['samplemath'].factory.split(':')[0]); print('Environment import OK')"
        env:
          CORRAL_WORK_DIR: ${{ runner.temp }}/corral-env-check

      - name: Run root project tests
        run: uv run pytest tests

  # Discover and test all tasks
  discover-tasks:
    needs: code-quality
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.discover.outputs.tasks }}
    steps:
      - uses: actions/checkout@v7

      - name: Discover tasks with tests
        id: discover
        run: |
          # Wetlab is tested separately because it requires a Conda-only dependency.
          tasks=$(find tasks -maxdepth 1 -type d -name "*" | while read task_dir; do
            if [[ "$(basename "$task_dir")" == "wetlab" ]]; then continue; fi
            if [[ -f "$task_dir/pyproject.toml" ]] && [[ -d "$task_dir/tests" ]]; then
              echo "$(basename "$task_dir")"
            fi
          done | jq -R -s -c 'split("\n")[:-1]')
          echo "tasks=$tasks" >> $GITHUB_OUTPUT
          echo "Found tasks with tests: $tasks"

  # Test each task in parallel
  test-tasks:
    needs: [discover-tasks, test-main]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Don't stop other tasks if one fails
      matrix:
        task: ${{ fromJson(needs.discover-tasks.outputs.tasks) }}

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Ensure Git LFS is initialized
        run: |
          git lfs install
          # Try to pull LFS objects, but don't fail if some are missing , this is because md environment has big files
          git lfs pull --exclude="" || echo "Some LFS objects missing, continuing..."

      - name: Require spectra NMR database
        if: matrix.task == 'spectra_elucidation'
        run: git lfs pull --include="scripts/vector_databases/nmrshiftdb2/**" --exclude=""

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
            enable-cache: true

      - name: Install root project (corral)
        run: uv sync --all-extras --dev

      - name: Install task dependencies
        run: |
          # Install the task package in development mode
          uv pip install -e .
        working-directory: ./tasks/${{ matrix.task }}

      - name: Check environment import
        # AFM requires Windows-only hardware dependencies.
        if: matrix.task != 'afm'
        run: |
          uv run python -c "from importlib import import_module; from corral.runtime.environment_loader import ENVIRONMENT_PRESETS; import_module(ENVIRONMENT_PRESETS['${{ matrix.task }}'].factory.split(':')[0]); print('Environment import OK')"
        env:
          CORRAL_WORK_DIR: ${{ runner.temp }}/corral-env-check
        working-directory: ./tasks/${{ matrix.task }}

      - name: Run task tests
        run: |
          # Set CORRAL_WORK_DIR for tests that need it
          export CORRAL_WORK_DIR=$(mktemp -d)
          # Run tests using uv run and ensure pytest uses the local config
          uv run python -m pytest tests -v --rootdir=.
        working-directory: ./tasks/${{ matrix.task }}

      - name: Check task runtime API
        run: uv run python -m pytest ../../tests/task_contracts -q --rootdir=../..
        env:
          CORRAL_TEST_ENVIRONMENT: ${{ matrix.task }}
        working-directory: ./tasks/${{ matrix.task }}

  # Wetlab requires Reaktoro, which is available from Conda but not from PyPI
  test-wetlab:
    needs: [code-quality, test-main]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: ""
          auto-activate: false
          conda-remove-defaults: true
          miniforge-version: latest

      - name: Create wetlab environment
        run: conda env create --file environment.yml
        working-directory: ./tasks/wetlab

      - name: Run wetlab tests
        run: conda run --no-capture-output -n wetlab python -m pytest tests -v --rootdir=.
        working-directory: ./tasks/wetlab

      - name: Check wetlab runtime API
        run: conda run --no-capture-output -n wetlab python -m pytest ../../tests/task_contracts -q --rootdir=../..
        env:
          CORRAL_TEST_ENVIRONMENT: wetlab
        working-directory: ./tasks/wetlab

  # Summary job to check all results
  test-summary:
    needs: [test-main, test-tasks, test-wetlab]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.test-main.result }}" == "success" ]] && \
             [[ "${{ needs.test-tasks.result }}" == "success" ]] && \
             [[ "${{ needs.test-wetlab.result }}" == "success" ]]; then
            echo "✅ All tests passed!"
          else
            echo "❌ Some tests failed:"
            echo "Main tests: ${{ needs.test-main.result }}"
            echo "Task tests: ${{ needs.test-tasks.result }}"
            echo "Wetlab tests: ${{ needs.test-wetlab.result }}"
            exit 1
          fi
