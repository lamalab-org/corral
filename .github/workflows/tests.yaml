name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6        # pin a recent uv
        with:
          version: "0.7.*"
          enable-cache: true

      # Install project (+dev & all extras). This creates .venv
      - name: Sync environment
        run: uv sync --all-extras --dev

      # Belt-and-braces: make sure pre-commit is available even if
      # it’s not yet in pyproject.toml
      - name: Ensure pre-commit is present
        run: uv pip install pre-commit

      - name: Cache pre-commit hook envs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

      - name: Fail if hooks rewrote files
        run: |
          git diff --quiet || {
            echo "::error::Code formatting issues found. Run pre-commit locally and commit the changes.";
            git --no-pager diff; exit 1; }

  tests:
    needs: code-quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.*"
          enable-cache: true

      - name: Verify lock & sync env reproducibly
        run: |
          uv lock --check                 # fast drift check
          uv sync --frozen --all-extras --dev

      - name: Run tests
        run: uv run pytest --cov=corral

      - name: Prune uv cache
        if: ${{ always() }}
        run: uv cache prune --ci
