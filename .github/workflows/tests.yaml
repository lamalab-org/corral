name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create venv and install pre-commit
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install pre-commit

      - name: Cache pre-commit hooks
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit checks
        run: |
          source .venv/bin/activate
          pre-commit run --all-files

      - name: Check if changes were made
        run: |
          if ! git diff --quiet; then
            echo "::error::Code formatting issues found. Run pre-commit locally and commit changes."
            git diff
            exit 1
          fi

  tests:
    needs: code-quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11"]

    defaults:
      run:
        shell: bash -l {0}


    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install root project
        run: uv sync --all-extras --dev

      - name: Install catalyst package
        # Change directory to the catalyst task and install its dependencies
        run: |
          # Configure Git to use the GITHUB_TOKEN for GitHub URLs
          # This is crucial for cloning private repositories or avoiding rate limits
          git config --global url."https://oauth2:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          uv sync --all-extras --dev
        working-directory: ./tasks/catalyst

      - name: Run root project tests
        # Runs tests in the main 'tests' directory
        run: uv run pytest tests

      - name: Run catalyst package tests
        # Runs tests specifically for the catalyst package
        run: uv run pytest tests
        working-directory: ./tasks/catalyst
