name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create venv and install pre-commit
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install pre-commit

      - name: Cache pre-commit hooks
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit checks
        run: |
          source .venv/bin/activate
          pre-commit run --all-files

      - name: Check if changes were made
        run: |
          if ! git diff --quiet; then
            echo "::error::Code formatting issues found. Run pre-commit locally and commit changes."
            git diff
            exit 1
          fi

  tests:
    needs: code-quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11"]

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pip packages
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv pip install .

      - name: Install everything (project + dev + extras)
        run: uv sync --all-extras --dev

      - name: Ensure pytest is installed
        run: uv pip install pytest pytest-cov

      - name: Run tests with pytest
        run: uv run pytest --cov=corral
