[project]
name = "macbench"
version = "0.1.0"
description = "Multimodal QA tasks with 34 different topics (arXiv:2411.16955)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chembench",
    "corral",
    "NSFopen",
    "scikit-learn",
    "langchain_community",
    "modal",
    "numpy",
    "pillow",
    "chromadb",
    "promptstore",
    "python-dotenv>=1.0.1",
    "loguru",
    "uvicorn>=0.34.0",
    # Without the next dependencies, some error occur when loading the dataset from huggingface
    "datasets==2.19.1",
    "huggingface-hub==0.26.0",
]

[tool.uv.sources]
chembench = { git = "https://github.com/lamalab-org/chembench.git", rev = "main" }
corral = { git = "https://github.com/lamalab-org/mat-agent-bench.git", rev = "main" }
promptstore = { git = "https://github.com/lamalab-org/promptstore.git", rev = "main" }
