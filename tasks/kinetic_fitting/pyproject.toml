[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kinetic_fitting"
version = "0.1.0"
description = "LLM agent environment for automated kinetic model optimization in photocatalysis research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "corral",
    "fastapi>=0.115.6",
    "h5py>=3.8.0",
    "litellm>=1.55.0",
    "loguru>=0.7.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "tables>=3.8.0",
    "scipy>=1.10.0",
    "uvicorn>=0.34.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kinetic_fitting"]

[tool.uv.sources]
# Use path dependency for monorepo setup
corral = { path = "../..", editable = true }

[dependency-groups]
dev = [
    "hypothesis>=6.136.0",
    "pytest-cov>=6.2.1",
    "pytest>=8.4.1",
    "pytest-mock>=3.14.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers --tb=short"