[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-code"
version = "0.1.0"
description = "ML training environment with code execution (sandbox-based)"
requires-python = ">=3.12"
dependencies = [
    "corral",
    "ml",
    "mp-api>=0.45.3",
    "pymatgen>=2025.1.9",
    "python-dotenv>=1.0.1",
    "scikit-learn>=1.6.1",
    "xgboost>=3.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_code"]

[tool.uv.sources]
corral = { path = "../..", editable = true }
ml = { path = "../ml", editable = true }

[dependency-groups]
dev = [
    "hypothesis>=6.136.0",
    "pytest-cov>=6.2.1",
    "pytest>=8.4.1",
    "pytest-mock>=3.14.1",
]
