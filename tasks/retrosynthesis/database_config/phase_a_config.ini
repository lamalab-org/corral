# Phase A Configuration
# Edit this file with your database credentials and file paths

[database]
host = localhost
port = 5432
database = reactions_raw_db
user = postgres
password = postgres

[files]
uspto_csv = uspto_data_mapped.csv
ord_csv = ord_data_mapped.csv

[processing]
# Number of rows to insert at once (increase for better performance with large files)
batch_size = 10000

# Skip validation with RDKit (set to true if RDKit not available)
skip_rdkit_validation = false

[staging]
# Table names (usually no need to change these)
staging_table = staging_reactions
errors_table = staging_errors
