[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "retrosynthesis"
version = "0.1.0"
description = "Retrosynthesis task for the Corral agentic framework"
readme = "README.md"
license = "MIT"
keywords = ["agent", "LLM", "benchmark", "retrosynthesis"]
requires-python = ">=3.11"
dependencies = [
    "corral",
    "reaction-utils @ git+https://github.com/MolecularAI/reaction_utils.git@main",
    "modal",
    "loguru",
    "psycopg2-binary",
    "chemprice",
    "torch",
    "rxnmapper",
    "setuptools<80",
]

[tool.setuptools]
packages = ["retrosynthesis"]

[tool.uv.sources]
corral = { path = "../..", editable = true }
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
override-dependencies = ["requests>=2.32.3", "pandas>=2.0", "tqdm>=4.66.3"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
