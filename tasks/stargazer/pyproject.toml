[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corral-stargazer"
version = "0.1.0"
description = "Radial-velocity exoplanet discovery tasks for Corral"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celerite2>=0.2",
    "corral",
    "loguru>=0.7.3",
    "numpy>=1.24",
    "pydantic>=2",
    "rebound>=3.24",
    "scipy>=1.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stargazer"]

[tool.uv.sources]
corral = { path = "../..", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
addopts = ["-p", "no:warnings", "--import-mode=importlib"]
testpaths = ["tests"]
