[project]
name = "corral-psychometrics"
version = "0.1.0"
description = "Synthetic psychometrics tasks, generators, and scoring checks"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cloudpickle>=3.0",
    "corral",
    "factor-analyzer>=0.5.1",
    # semopy 2.3.11 (its last release) calls np.ma.corrcoef(bias=...), removed in
    # NumPy 2.4, and scipy.stats.mvn.mvnun, removed in SciPy 1.14. Both break its
    # ordinal/polychoric path.
    "numpy>=2.0,<2.4",
    "pandas>=2.2",
    "scikit-learn>=1.4,<1.7",
    "scipy>=1.13,<1.14",
    "semopy>=2.3.11",
    "statsmodels>=0.14",
]

[tool.uv.sources]
corral = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.16.8,<0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/corral_psychometrics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["artifacts", "environments"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]
