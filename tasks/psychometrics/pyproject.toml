[project]
name = "psychometrics-task-environment"
version = "0.1.0"
description = "Synthetic psychometrics tasks, generators, and scoring checks"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cloudpickle>=3.0",
    "corral",
    "factor-analyzer>=0.5.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.4,<1.7",
    "scipy>=1.14",
    "semopy>=2.3.11",
]

[tool.uv.sources]
corral = { path = "../..", editable = true }

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["psychometrics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["artifacts", "environments"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]
