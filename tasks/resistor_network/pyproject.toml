[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resistor_network"
version = "0.1.0"
description = "Resistor network environment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "corral",
    "numpy>=2.2.6",
    "python-dotenv>=1.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/resistor_network"]

[tool.uv.sources]
# Use workspace dependency for monorepo setup
corral = { workspace = true }

[dependency-groups]
dev = [
    "hypothesis>=6.136.0",
    "pytest-cov>=6.2.1",
    "pytest>=8.4.1",
    "pytest-mock>=3.14.1",
    "ipython>=9.0.1",
]
