[project]
name = "spectra_elucidation"
version = "0.1.0"
description = "Open Ended Spectra Elucidation task"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "corral",
    "loguru",
    "rdkit",
    "modal",
    "chromadb",
    "more-itertools",
    "uvicorn>=0.34.0",
    "torch",
    "transformers<5",
]

[tool.setuptools]
packages = ["spectra_elucidation"]

[tool.uv.sources]
corral = { path = "../..", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
