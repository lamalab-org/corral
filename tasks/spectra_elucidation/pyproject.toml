[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "spectra_elucidation"
version = "0.1.0"
description = "Open Ended Spectra Elucidation task"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "corral",
    "loguru",
    "rdkit",
    "modal",
    "chromadb",
    "more-itertools",
    "uvicorn>=0.34.0",
    "torch",
    # The `search_by_smiles` tool loads a MoLFormer model via `AutoModel.from_pretrained(...,
    # trust_remote_code=True)`; that remote modeling code imports
    # `create_bidirectional_mask` from `transformers.masking_utils`, which does not exist
    # before this line -- every search_by_smiles call fails with an ImportError below it.
    # Bump deliberately if MoLFormer's remote code changes what it needs.
    "transformers>=5.14.1",
]

[tool.setuptools]
packages = ["spectra_elucidation"]

[tool.uv.sources]
corral = { path = "../..", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
