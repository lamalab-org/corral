[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "physchool"
version = "0.0.1"
description = "cool physics (vendored copy with the missing physchool/worlds/__init__.py added; see NOTICE.md)"
requires-python = ">=3.9"
dependencies = ["numpy", "jax", "scipy"]

[tool.hatch.build.targets.wheel]
packages = ["physchool"]
