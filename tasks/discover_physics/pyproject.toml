[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "discover_physics"
version = "0.1.0"
description = "DiscoverPhysics environment: agents infer hidden physics laws from simulated experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "corral",
    "physchool",
    "scienceagent",
    "loguru>=0.7.3",
    "python-dotenv>=1.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/discover_physics"]

[tool.uv.sources]
# Use path dependency for monorepo setup
corral = { path = "../..", editable = true }
# ScienceAgent (executors/evaluators) lives as a subdirectory of the upstream
# DiscoverPhysics repo and is not published to PyPI, so pull it from git.
scienceagent = { git = "https://github.com/SampsonML/DiscoverPhysics", subdirectory = "ScienceAgent" }
# PhysicsSchool (simulator) is vendored locally instead of a plain git
# dependency: its physchool/worlds/ subpackage has no __init__.py, so
# find_packages() drops it from a normal (non-editable) install and
# `physchool.worlds` ends up missing entirely. See vendor/physchool_fixed/NOTICE.md.
physchool = { path = "vendor/physchool_fixed", editable = true }

[dependency-groups]
dev = [
    "hypothesis>=6.136.0",
    "pytest-cov>=6.2.1",
    "pytest>=8.4.1",
    "pytest-mock>=3.14.1",
]
