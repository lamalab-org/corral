[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "wetlab"
version = "1.0"
requires-python = ">=3.10"
dependencies = [
    "colormath",
    "colour-science",
    "corral",
    "loguru",
]
authors = [
    {name = "Sadra Aghajani"},
]

[tool.setuptools]
packages = ["wetlab"]

[tool.uv.sources]
corral = { path = "../..", editable = true }

# NOTE: reaktoro is conda-only. After `uv sync`, install it via:
#   conda install -c conda-forge reaktoro --prefix .venv
