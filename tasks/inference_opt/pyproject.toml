[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "corral-inference-opt"
version = "0.1.0"
description = "Inference-time optimization environment for frozen student LLMs."
requires-python = ">=3.11"
dependencies = [
    "corral[claude,codex,openhands]",
    "requests>=2.32.3",
    # 0.3.259+ needs openai>=3.1 for its vllm/ provider, but every litellm
    # release caps openai<3. Unpin once litellm allows openai 3.
    "inspect-ai==0.3.258",
    "inspect-evals>=0.1.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
]

[tool.uv.sources]
corral = { path = "../..", editable = true }

[tool.setuptools.packages.find]
include = ["inference_opt*"]

[tool.setuptools.package-data]
"inference_opt" = [
    "data/frozen/*/manifest.json",
    "data/frozen/*/*.parquet",
    "data/frozen/*/public/*.jsonl",
    "data/baselines/*.json",
    "guide/*.md",
    "templates/policy/*",
]
