[project]
name = "kinetic_modeling"
version = "0.1.0"
description = "Rate Law environment for the corral simulation agent benchmark framework."
readme = "README.md"
license = "MIT"
keywords = ["agent", "LLM", "benchmark"]
requires-python = ">=3.11"
dependencies = [
    "corral",
    "modal==0.70",
    "datasets",
    "numpy",
    "scipy",
    "loguru",
]
[tool.uv.sources]
corral = { path = "../..", editable = true }
