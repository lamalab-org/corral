[project]
name = "corral-md-tutorials"
version = "0.1.0"
description = "LAMMPS MD Tutorials environment for the corral simulation agent benchmark framework."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Chandan Gupta", email = "chandan18386@iiitd.ac.in" }]
keywords = ["agent", "LLM", "benchmark"]
requires-python = ">=3.11"
dependencies = [
    "corral",
    "modal==0.70",
    "protobuf==3.20.*",
    "rich>=13.9.4",
    "mp-api",
    "pymatgen",
    "ase",
    "pypdf",
    "more-itertools"
]
[tool.uv.sources]
corral = { git = "https://github.com/lamalab-org/mat-agent-bench.git", branch = "main" } #TODO: change to main branch when merged