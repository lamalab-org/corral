[project]
name = "MP-RAG-Task"
version = "0.1.0"
description = "RAG-based task inspired from the Llamp agent project (arXiv:2401.17244)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "corral",
    "loguru",
    "emmet-core>=0.84.5",
    "mp-api>=0.45.3",
    "langchain_community",
    "langchain-experimental>=0.3.4",
    "wikipedia>=1.4.0",
    "arxiv>=2.1.3",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.34.0",
    "mp_api",
]

[tool.uv.sources]
corral = { git = "https://github.com/lamalab-org/mat-agent-bench.git", rev = "main" }
