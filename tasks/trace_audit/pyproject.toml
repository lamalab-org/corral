[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corral-trace-audit"
version = "0.1.0"
description = "Trace audit pilot environments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["corral"]

[tool.hatch.build.targets.wheel]
packages = ["src/trace_audit"]

[tool.uv.sources]
corral = { path = "../..", editable = true }
