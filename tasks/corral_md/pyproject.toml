[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "corral_md"
version = "0.1.0"
description = "LAMMPS MD environment for the corral simulation agent benchmark framework."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Chandan Gupta", email = "chandan18386@iiitd.ac.in" }]
keywords = ["agent", "LLM", "benchmark"]
requires-python = ">=3.11"
dependencies = [
    "corral",
    "modal==0.70",
    "protobuf==3.20.*",
    "rich>=13.9.4",
    "mp-api",
    "pymatgen",
    "ase",
    "pypdf",
    "more-itertools",
    "hypothesis>=6.136.0",
    "pytest-cov>=6.2.1",
    "pytest>=8.4.1",
    "pytest-mock>=3.14.1",
    "streamlit>=1.46.1"
]

[tool.hatch.build.targets.wheel]
packages = ["src/corral_md"]


[tool.uv.sources]
# Use path dependency for monorepo setup
corral = { path = "../..", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]
