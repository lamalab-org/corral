[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "corral_md"
version = "0.1.0"
description = "LAMMPS MD environment for the corral simulation agent benchmark framework."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Chandan Gupta", email = "chandan18386@iiitd.ac.in" }]
keywords = ["agent", "LLM", "benchmark"]
requires-python = ">=3.11"
dependencies = [
    "corral",
    "modal>=1.4.1",
    "protobuf==3.20.*",
    "mp-api",
    "pymatgen",
    "ase",
    "numpy",
    "pandas",
    "scipy",
    "log-lammps-reader",
    "polars>=1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/corral_md"]

[tool.hatch.build.targets.wheel.force-include]
"environments" = "corral_md/environments"
"structures.zip" = "corral_md/workflow_scoring/structures.zip"


[tool.uv.sources]
# Use path dependency for monorepo setup
corral = { path = "../..", editable = true }

[dependency-groups]
dev = [
    "hatchling",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
]
