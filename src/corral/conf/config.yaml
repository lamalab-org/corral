# Default Corral Benchmark Configuration
# ========================================
# Override any value from the CLI:
#   corral-hydra agent=react runner.trials_per_task=10
#
# Run a sweep:
#   corral-hydra --multirun agent=react,tool_calling runner.trials_per_task=1,5,10

defaults:
  - agent: tool_calling
  - runner: default
  - docker: default
  - _self_

# Execution mode: "local" (direct Python) or "docker" (containerised)
mode: local

# Task selection (empty = all tasks)
tasks:
  ids: []

# Weights & Biases logging
wandb:
  enabled: false
  project: corral-benchmark
  entity: null
  tags: []
