# Example Corral Benchmark Configuration File
# ============================================
image: ghcr.io/lamalab-org/corral-materials:latest
agent: ReActAgent
model: claude-sonnet-4-5-20250929
trials: 5
max_iterations: 20
temperature: 1.0
tasks: "task_1,task_2,task_3"
output: results/benchmark_results.json
detach: false
verbose: true

# Custom metrics file (optional)
# Path to a Python file containing custom metrics.
# The file should export a METRICS list with Metric instances.
# Example: metrics_file: ./my_custom_metrics.py
metrics_file: null

# Extra parameters for the agent
agent_kwargs:
  system_prompt: "You are a helpful chemistry assistant."

# Extra parameters for the benchmark runner
runner_kwargs:
enable_surrender: true
